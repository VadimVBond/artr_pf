<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2B2B35">
  <title data-i18n="meta.title">Vadim — Single Project</title>
  <link rel="icon" type="image/x-icon" href="img/thumbnail.ico">
  <meta name="description" content="Portfolio project details page">

  <!-- CSS -->
  <link rel="stylesheet" href="css/plugins/bootstrap.min.css">
  <link rel="stylesheet" href="css/plugins/font-awesome.min.css">
  <link rel="stylesheet" href="css/plugins/swiper.min.css">
  <link rel="stylesheet" href="css/plugins/fancybox.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/color-4.css">
</head>

<body>
  <div class="art-app">
    <!-- Preloader -->
    <div class="art-preloader">
      <div class="art-preloader-content">
        <h4>Vadim</h4>
        <div id="preloader"></div>
      </div>
    </div>

    <div class="art-mobile-top-bar"></div>

    <div class="art-app-wrapper">
      <div class="art-app-container">
        <div data-component="layout/sidebar" data-source="profile"></div>

        <div class="art-content">
          <div class="art-curtain"></div>
          <div class="art-top-bg" style="background-image: url(img/bg.jpg)">
            <div class="art-top-bg-overlay"></div>
          </div>

          <div class="transition-fade" id="swup">
            <div id="scrollbar" class="art-scroll-frame">

              <section data-component="sections/portfolio-single" data-source="project-single"></section>

              <section data-component="sections/counters" data-source="counters"></section>

              <footer data-component="layout/footer" data-source="footer"></footer>

            </div>
          </div>
        </div>

        <div data-component="layout/navbar" data-source="navigation"></div>
      </div>
    </div>
  </div>

  <!-- Scripts: Order is Critical -->
  <script src="js/plugins/jquery.min.js"></script>
  <script src="js/plugins/swiper.min.js"></script>
  <script src="js/plugins/progressbar.min.js"></script>
  <script src="js/plugins/fancybox.min.js"></script>
  <script src="js/plugins/smooth-scrollbar.min.js"></script>
  <script src="js/plugins/overscroll.min.js"></script>
  <script src="js/plugins/anime.min.js"></script>

  <!-- Custom Modules (New Architecture) -->
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components-loader.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
