<div class="container-fluid">
  <div class="row p-30-0">

    <div class="col-lg-12">
      <div class="art-section-title">
        <div class="art-title-frame">
          <h4 data-i18n="blog.title">{{sectionTitle}}</h4>
        </div>
      </div>
    </div>

    {{#each posts}}
    <div class="col-lg-4">
      <div class="art-a art-blog-card">
        <a href="{{link}}" class="art-port-cover">
          <img src="{{cover}}" alt="{{title}}" loading="lazy">
        </a>
        <div class="art-post-description">
          <a href="{{link}}">
            <h5 class="mb-15">{{title}}</h5>
          </a>
          <div class="mb-15">{{excerpt}}</div>
          <a href="{{link}}" class="art-link art-color-link art-w-chevron" data-i18n="blog.readMore">Read more</a>
        </div>
      </div>
    </div>
    {{/each}}

    <div class="col-lg-12">
      <div class="art-a art-pagination">
        <a href="{{pagination.prevLink}}" class="art-link art-color-link art-w-chevron art-left-link"><span data-i18n="blog.prevPage">Previous page</span></a>
        <div class="art-pagination-center art-m-hidden">
          <a href="{{pagination.prevLink}}">1</a>
          <a class="art-active-pag" href="#">2</a>
          <a href="{{pagination.nextLink}}">3</a>
        </div>
        <a href="{{pagination.nextLink}}" class="art-link art-color-link art-w-chevron"><span data-i18n="blog.nextPage">Next page</span></a>
      </div>
    </div>

  </div>
</div>
