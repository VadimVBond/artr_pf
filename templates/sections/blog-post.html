<!-- Post Header -->
<div class="container-fluid">
  <div class="row p-30-0">

    <div class="col-lg-12">
      <div class="art-section-title">
        <div class="art-title-frame">
          <h4>{{title}}</h4>
        </div>
        <div class="art-right-frame">
          <div class="art-project-category">{{category}}</div>
        </div>
      </div>
    </div>

    <div class="col-lg-12">
      <div class="art-a art-project-cover">
        <a data-fancybox="gallery" href="{{cover}}" class="art-portfolio-item-frame art-horizontal">
          <img src="{{cover}}" alt="{{title}}" loading="lazy">
          <span class="art-item-hover"><i class="fas fa-expand"></i></span>
        </a>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="art-a art-card">
        <p class="art-lg-text art-white"><i>{{intro}}</i></p>
        <p>{{content}}</p>
        <ul class="art-custom-list">
          {{#each list}}
          <li>{{this}}</li>
          {{/each}}
        </ul>
        <blockquote>{{quote}}</blockquote>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="art-a art-card">
        <div class="art-table p-15-15">
          <ul>
            {{#each details}}
            <li>
              <h6>{{label}}</h6><span>{{value}}</span>
            </li>
            {{/each}}
          </ul>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Post Pagination -->
<div class="container-fluid">
  <div class="row">
    <div class="col-lg-12">
      <div class="art-a art-pagination">
        <a href="{{pagination.prevLink}}" class="art-link art-color-link art-w-chevron art-left-link"><span data-i18n="blog.prevPost">Previous post</span></a>
        <div class="art-pagination-center art-m-hidden">
          <a class="art-link" href="{{pagination.allLink}}" data-i18n="blog.allPosts">All publications</a>
        </div>
        <a href="{{pagination.nextLink}}" class="art-link art-color-link art-w-chevron"><span data-i18n="blog.nextPost">Next post</span></a>
      </div>
    </div>
  </div>
</div>

<!-- Related Posts -->
<div class="container-fluid">
  <div class="row p-30-0">

    <div class="col-lg-12">
      <div class="art-section-title">
        <div class="art-title-frame">
          <h4 data-i18n="blog.similarPosts">Similar posts</h4>
        </div>
      </div>
    </div>

    <div class="col-lg-12">
      <div class="swiper-container art-blog-slider" style="overflow: visible">
        <div class="swiper-wrapper">
          {{#each relatedPosts}}
          <div class="swiper-slide">
            <div class="art-a art-blog-card">
              <a href="{{link}}" class="art-port-cover">
                <img src="{{cover}}" alt="{{title}}" loading="lazy">
              </a>
              <div class="art-post-description">
                <a href="{{link}}"><h5 class="mb-15">{{title}}</h5></a>
                <div class="mb-15">{{excerpt}}</div>
                <a href="{{link}}" class="art-link art-color-link art-w-chevron" data-i18n="blog.readMore">Read more</a>
              </div>
            </div>
          </div>
          {{/each}}
        </div>
      </div>
    </div>

    <div class="col-lg-12">
      <div class="art-slider-navigation">
        <div class="art-sn-left">
          <div class="swiper-pagination"></div>
        </div>
        <div class="art-sn-right">
          <div class="art-slider-nav-frame">
            <div class="art-slider-nav art-blog-swiper-prev"><i class="fas fa-chevron-left"></i></div>
            <div class="art-slider-nav art-blog-swiper-next"><i class="fas fa-chevron-right"></i></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
