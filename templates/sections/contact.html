<div class="container-fluid">
  <div class="row p-30-0">

    <div class="col-lg-12">
      <div class="art-section-title">
        <div class="art-title-frame">
          <h4 data-i18n="contact.title">{{title}}</h4>
        </div>
      </div>
    </div>

    <!-- Address -->
    <div class="col-lg-4">
      <div class="art-a art-card">
        <div class="art-table p-15-15">
          <ul>
            {{#each address}}
            <li><h6>{{label}}</h6><span>{{value}}</span></li>
            {{/each}}
          </ul>
        </div>
      </div>
    </div>

    <!-- Online -->
    <div class="col-lg-4">
      <div class="art-a art-card">
        <div class="art-table p-15-15">
          <ul>
            {{#each online}}
            <li><h6>{{label}}</h6><span>{{value}}</span></li>
            {{/each}}
          </ul>
        </div>
      </div>
    </div>

    <!-- Phone -->
    <div class="col-lg-4">
      <div class="art-a art-card">
        <div class="art-table p-15-15">
          <ul>
            {{#each phone}}
            <li><h6>{{label}}</h6><span>{{value}}</span></li>
            {{/each}}
          </ul>
        </div>
      </div>
    </div>

    <!-- Contact Form -->
    <div class="col-lg-12">
      <div class="art-section-title">
        <div class="art-title-frame">
          <h4 data-i18n="contact.formTitle">{{form.title}}</h4>
        </div>
      </div>

      <div class="art-a art-card">
        <form id="form" class="art-contact-form">
          <div class="art-form-field">
            <input id="name" name="name" class="art-input" type="text" placeholder="{{form.namePlaceholder}}" required>
            <label for="name"><i class="fas fa-user"></i></label>
          </div>
          <div class="art-form-field">
            <input id="email" name="email" class="art-input" type="email" placeholder="{{form.emailPlaceholder}}" required>
            <label for="email"><i class="fas fa-at"></i></label>
          </div>
          <div class="art-form-field">
            <textarea id="message" name="text" class="art-input" placeholder="{{form.messagePlaceholder}}" required></textarea>
            <label for="message"><i class="far fa-envelope"></i></label>
          </div>
          <div class="art-submit-frame">
            <button class="art-btn art-btn-md art-submit" type="submit">
              <span data-i18n="contact.submit">{{form.submitText}}</span>
            </button>
            <div class="art-success">Success <i class="fas fa-check"></i></div>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
