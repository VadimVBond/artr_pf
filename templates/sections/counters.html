<section class="art-section art-gray-bg">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="art-section-title">
          <div class="art-title-frame">
            <h4>{{title}}</h4>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      {{#each items}}
      <div class="col-lg-3 col-md-6">
        <div class="art-counter-frame">
          <div class="art-counter-box">
            <span class="art-counter">{{value}}</span><span class="art-counter-plus">{{suffix}}</span>
          </div>
          <h6>{{label}}</h6>
        </div>
      </div>
      {{/each}}
    </div>
  </div>
</section>
