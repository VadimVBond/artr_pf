<!-- Service Card Component -->
<!-- Usage: <div data-component="service-card" data-source="services" data-index="0"></div> -->
<div class="art-a art-service-icon-box">
  <div class="art-service-ib-content">
    <!-- icon placeholder - can be added via data -->
    <div class="art-service-ib-icon">
      <i class="{{icon}}"></i>
    </div>
    <h5 class="mb-15">{{title}}</h5>
    <div class="mb-15">{{description}}</div>
    <div class="art-buttons-frame">
      <a href="{{link}}" class="art-link art-color-link art-w-chevron">{{linkText}}</a>
    </div>
  </div>
</div>
