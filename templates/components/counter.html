<!-- Counter Component -->
<!-- Usage: <div data-component="counter" data-source="counters" data-index="0"></div> -->
<div class="art-counter-frame">
  <div class="art-counter-box">
    <span class="art-counter">{{value}}</span><span class="art-counter-plus">{{suffix}}</span>
  </div>
  <h6>{{label}}</h6>
</div>
