<!-- Counter Component -->
<!-- Usage: data-component="counter" with data-value, data-suffix, data-label -->
<div class="art-counter-frame">
  <div class="art-counter-box">
    <span class="art-counter" data-content="value">0</span>
    <span class="art-counter-plus" data-content="suffix"></span>
  </div>
  <h6 data-content="label">Counter Label</h6>
</div>
