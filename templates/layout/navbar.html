<div class="art-menu-bar">
  <div class="art-menu-bar-frame">
    <div class="art-menu-bar-header">
      <div class="art-menu-bar-btn">
        <span></span>
      </div>
    </div>

    <div class="art-current-page"></div>

    <div class="art-scroll-frame">
      <nav id="swupMenu">
        <ul class="main-menu">
          {{#each items}}
          <li class="menu-item {{#if submenu}}menu-item-has-children{{/if}} {{#if active}}current-menu-item{{/if}}">
            <a href="{{url}}" {{#if target}}target="{{target}}"{{/if}} data-i18n="{{label}}">{{label}}</a>
            {{#if submenu}}
            <ul class="sub-menu">
              {{#each submenu}}
              <li class="menu-item">
                <a href="{{url}}" {{#if target}}target="{{target}}"{{/if}} data-i18n="{{label}}">{{label}}</a>
              </li>
              {{/each}}
            </ul>
            {{/if}}
          </li>
          {{/each}}
        </ul>
      </nav>

      <ul class="art-language-change art-theme-change">
        <li><a href="#." data-theme="color-1" style="color: #FFC107"><i class="fas fa-circle"></i></a></li>
        <li><a href="#." data-theme="color-2" style="color: #f44336"><i class="fas fa-circle"></i></a></li>
        <li><a href="#." data-theme="color-3" style="color: #4CAF50"><i class="fas fa-circle"></i></a></li>
        <li class="art-active-theme"><a href="#." data-theme="color-4" style="color: #64B5F6"><i class="fas fa-circle"></i></a></li>
      </ul>

      <ul class="art-language-change">
        <li><a href="#." data-lang="uk">🇺🇦 UK</a></li>
        <li><a href="#." data-lang="ru">🇷🇺 RU</a></li>
        <li class="art-active-lang"><a href="#." data-lang="en">🇬🇧 EN</a></li>
      </ul>
    </div>
  </div>
</div>
