<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SEO Чек-лист</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #333;
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: #222;
      color: #ddd;
    }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    body.dark th { background: #444; }
    .category { background: #ddd; font-weight: bold; }
    body.dark .category { background: #555; }
    .buttons { text-align: center; margin: 20px 0; }
    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #0056b3; }
    #themeToggle { float: right; }
  </style>
</head>
<body>
  <h1>SEO Чек-лист для сайта
    <button id="themeToggle">🌙 Тёмная тема</button>
  </h1>

  <div class="buttons">
    <button onclick="exportJSON()">Экспорт JSON</button>
    <button onclick="exportExcel()">Экспорт Excel</button>
    <button onclick="exportPDF()">Экспорт PDF</button>
  </div>

  <div id="checklist"></div>
  <p class="total" id="summary">Итого: 0 ч / $0</p>

<script>
const checklistData = [
  {
    category: "SEO",
    items: [
      { task: "SEO-аудит сайта", hours: 5, cost: 100 },
      { task: "Подбор ключевых слов", hours: 3, cost: 60 },
      { task: "Оптимизация мета-тегов (title, description, keywords)", hours: 4, cost: 80 },
      { task: "Настройка ЧПУ URL", hours: 2, cost: 40 },
      { task: "Внутренняя перелинковка", hours: 3, cost: 60 },
      { task: "Регистрация сайта в поисковых системах", hours: 2, cost: 50 }
    ]
  }
];

// Чек-лист
function loadChecklist() {
  const saved = JSON.parse(localStorage.getItem("checklistState") || "{}");
  const container = document.getElementById("checklist");
  container.innerHTML = "";
  checklistData.forEach(cat => {
    const table = document.createElement("table");
    const header = document.createElement("tr");
    header.innerHTML = `<th colspan="4" class="category">${cat.category}</th>`;
    table.appendChild(header);
    const headRow = document.createElement("tr");
    headRow.innerHTML = "<th>✓</th><th>Задача</th><th>Часы</th><th>Стоимость</th>";
    table.appendChild(headRow);
    cat.items.forEach((item, i) => {
      const row = document.createElement("tr");
      const id = `${cat.category}-${i}`;
      const checked = saved[id] ? "checked" : "";
      row.innerHTML = `
        <td><input type="checkbox" id="${id}" ${checked} onchange="saveState()"></td>
        <td>${item.task}</td>
        <td>${item.hours}</td>
        <td>$${item.cost}</td>`;
      table.appendChild(row);
    });
    container.appendChild(table);
  });
  updateSummary();
}

// Сохранение состояния
function saveState() {
  const state = {};
  document.querySelectorAll("input[type=checkbox]").forEach(cb => {
    state[cb.id] = cb.checked;
  });
  localStorage.setItem("checklistState", JSON.stringify(state));
  updateSummary();
}

// Итоги
function updateSummary() {
  let totalHours = 0, totalCost = 0;
  checklistData.forEach((cat, ci) => {
    cat.items.forEach((item, i) => {
      const id = `${cat.category}-${i}`;
      const cb = document.getElementById(id);
      if (cb && cb.checked) {
        totalHours += item.hours;
        totalCost += item.cost;
      }
    });
  });
  document.getElementById("summary").textContent =
    `Итого: ${totalHours} ч / $${totalCost}`;
}

// Экспорт JSON
function exportJSON() {
  const state = JSON.parse(localStorage.getItem("checklistState") || "{}");
  const selected = [];
  checklistData.forEach(cat => {
    cat.items.forEach((item, i) => {
      const id = `${cat.category}-${i}`;
      if (state[id]) selected.push({...item, category: cat.category});
    });
  });
  const blob = new Blob([JSON.stringify(selected, null, 2)], {type: "application/json"});
  downloadBlob(blob, "seo-checklist.json");
}

// Экспорт Excel
function exportExcel() {
  const wb = XLSX.utils.book_new();
  const wsData = [["Категория","Задача","Часы","Стоимость"]];
  const state = JSON.parse(localStorage.getItem("checklistState") || "{}");
  checklistData.forEach(cat => {
    cat.items.forEach((item, i) => {
      const id = `${cat.category}-${i}`;
      if (state[id]) wsData.push([cat.category, item.task, item.hours, item.cost]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  XLSX.utils.book_append_sheet(wb, ws, "Checklist");
  XLSX.writeFile(wb, "seo-checklist.xlsx");
}

// Экспорт PDF
// ...existing code...
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont("times", "normal"); // "times" лучше для кириллицы
  doc.setFontSize(12);
  let y = 10;
  doc.text("SEO Чек-лист", 10, y); y += 10;
  const state = JSON.parse(localStorage.getItem("checklistState") || "{}");
  checklistData.forEach(cat => {
    doc.text(cat.category, 10, y); y += 8;
    cat.items.forEach((item, i) => {
      const id = `${cat.category}-${i}`;
      if (state[id]) {
        const line = `- ${item.task}: ${item.hours} ч, $${item.cost}`;
        const splitText = doc.splitTextToSize(line, 180);
        doc.text(splitText, 15, y);
        y += splitText.length * 8;
      }
    });
  });
  doc.save("seo-checklist.pdf");
}
// ...existing code...


// Скачивание блоба
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// Переключатель темы
const themeBtn = document.getElementById("themeToggle");
themeBtn.onclick = () => {
  document.body.classList.toggle("dark");
  themeBtn.textContent = document.body.classList.contains("dark") ? "☀️ Светлая тема" : "🌙 Тёмная тема";
};

// Инициализация
window.onload = loadChecklist;
</script>
</body>
</html>
