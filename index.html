<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vadim - Portfolio</title>
  <link rel="icon" type="image/x-icon" href="img/thumbnail.ico">

  <!-- CSS -->
  <link rel="stylesheet" href="css/plugins/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/color-4.css">
</head>

<body>

  <!-- Preloader -->
  <div class="art-preloader">
    <div class="art-preloader-content">
      <h4>Vadim</h4>
      <div id="preloader"></div>
    </div>
  </div>

  <!-- Layout Components -->
  <div data-component="layout/sidebar" data-source="profile"></div>
  <div data-component="layout/navbar" data-source="navigation"></div>

  <!-- Main Content -->
  <main class="art-content" id="scrollbar">
    <div class="art-curtain"></div>
    <div class="art-mobile-top-bar"></div>

    <!-- Sections Container -->
    <div class="art-app-window">

      <!-- Banner Section (Static for now) -->
      <section class="art-banner-section">
        <div class="art-banner-overlay"></div>
        <div class="container">
          <div class="row">
            <div class="col-lg-12">
              <div class="art-banner-frame">
                <h1 class="art-banner-title">Front-end Developer & UI/UX Designer</h1>
                <p class="art-banner-text">Creating digital experiences that matter.</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Counters Section -->
      <section data-component="sections/counters" data-source="counters"></section>

      <!-- Services Section -->
      <section data-component="sections/services" data-source="services"></section>

      <!-- Pricing Section -->
      <section data-component="sections/pricing" data-source="prices"></section>

    </div>

    <!-- Footer -->
    <footer data-component="layout/footer" data-source="footer"></footer>
  </main>

  <!-- Scripts: Order is Critical -->
  <script src="js/plugins/jquery.min.js"></script>
  <script src="js/plugins/bootstrap.bundle.min.js"></script>
  <script src="js/plugins/swiper.min.js"></script>
  <script src="js/plugins/progressbar.min.js"></script>

  <!-- Отключено: файлы отсутствуют в репозитории -->
  <!-- <script src="js/plugins/isotope.pkgd.min.js"></script> -->
  <!-- <script src="js/plugins/overscroll.min.js"></script> -->

  <script src="js/plugins/fancybox.min.js"></script>
  <script src="js/plugins/smooth-scrollbar.min.js"></script>
  <script src="js/plugins/anime.min.js"></script>

  <!-- Custom Modules (New Architecture) -->
  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components-loader.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
